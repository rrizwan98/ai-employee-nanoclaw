[pytest]
# NanoClaw Container Tests Configuration
# 4-Level TDD Testing System

# Test discovery
testpaths = .
python_files = test_*.py level*_tests.py
python_classes = Test*
python_functions = test_*

# Markers for test levels
markers =
    level1: Syntax tests (fast, no dependencies, ~5s)
    level2: Import tests (requires Python SDK, ~15s)
    level3: Runtime tests (requires sandbox container, ~60s)
    level4: Integration tests (requires full stack, ~120s)

# Async configuration
asyncio_mode = auto

# Timeout settings (in seconds)
timeout = 120

# Output settings
addopts =
    -v
    --tb=short
    --strict-markers

# Ignore patterns
norecursedirs =
    node_modules
    __pycache__
    .git
    sandbox

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
